<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Spinners Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a0f;
    --bg-card: #12121a;
    --bg-card-hover: #1a1a26;
    --border: #1e1e2e;
    --border-hover: #2e2e44;
    --text-primary: #e2e2ef;
    --text-secondary: #7a7a9a;
    --text-dim: #4a4a66;
    --accent: #64ffb4;
    --accent-dim: #64ffb420;
    --accent-secondary: #6488ff;
    --accent-warn: #ffa864;
    --spinner-glow: #64ffb430;
    --tag-bg: #1a1a2e;
    --tag-border: #2a2a44;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
    position: relative;
    z-index: 1;
  }
  header {
    text-align: center;
    padding: 3rem 0 2rem;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .logo-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    opacity: 0.7;
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 1rem;
    font-weight: 300;
    max-width: 580px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .top-tabs {
    display: inline-flex;
    gap: 0.4rem;
    margin: 1.35rem auto 0.2rem;
    padding: 0.3rem;
    background: #0f1320;
    border: 1px solid var(--tag-border);
    border-radius: 11px;
  }
  .top-tab {
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.42rem 0.78rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .top-tab:hover { color: var(--text-primary); }
  .top-tab.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin: 2.5rem 0 1.5rem;
  }
  .search-wrap {
    position: relative;
    flex: 0 1 360px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    width: 16px;
    height: 16px;
  }
  .search-input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.6rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .speed-control input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .progress-width-control {
    display: none;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .progress-width-control input[type="range"] {
    width: 100px;
    accent-color: var(--accent-secondary);
    cursor: pointer;
  }
  .figlet-input-bar,
  .figlet-sort-control {
    display: none;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .figlet-input-bar label {
    color: var(--text-secondary);
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .figlet-input-bar input,
  .figlet-sort-control select {
    background: #0d1118;
    border: 1px solid #2a3147;
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.42rem 0.58rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .figlet-input-bar input:focus,
  .figlet-sort-control select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(100, 255, 180, 0.14);
    background: #0b1118;
  }
  .figlet-input-bar {
    position: sticky;
    top: 0.4rem;
    z-index: 18;
    padding: 0.52rem 0.68rem;
    background: linear-gradient(180deg, rgba(16,19,30,0.96), rgba(15,18,28,0.86));
    border: 1px solid #26304b;
    border-radius: 11px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 26px rgba(4, 8, 18, 0.38), inset 0 1px 0 rgba(120, 150, 255, 0.08);
  }
  .figlet-input-bar input {
    width: 200px;
  }
  .figlet-sort-control select {
    cursor: pointer;
  }
  .figlet-char-count {
    color: #96a5c7;
    font-size: 0.68rem;
    min-width: 4.2ch;
    text-align: right;
    padding: 0.18rem 0.32rem;
    border-radius: 6px;
    background: rgba(20, 29, 48, 0.72);
    border: 1px solid rgba(58, 76, 114, 0.55);
  }
  .figlet-reset-btn {
    background: linear-gradient(180deg, #161f35, #11192d);
    border: 1px solid #2f4468;
    border-radius: 7px;
    color: #b7c4df;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1;
    padding: 0.34rem 0.48rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.18s, background 0.2s;
  }
  .figlet-reset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
    background: linear-gradient(180deg, #182741, #132137);
  }
  body.tab-progress .progress-width-control { display: flex; }
  body.tab-figlet .figlet-input-bar,
  body.tab-figlet .figlet-sort-control { display: flex; }
  .filter-tags {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .filter-tag {
    padding: 0.4rem 0.85rem;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .filter-tag:hover { border-color: var(--accent); color: var(--text-primary); }
  .filter-tag.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .stats-bar {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .stats-bar span { color: var(--accent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    transition: all 0.25s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
  }
  .card:hover::before { opacity: 1; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .spinner-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }
  .spinner-lib {
    font-size: 0.62rem;
    font-weight: 500;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .spinner-display {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1rem;
    background: #08080e;
    border-radius: 8px;
    margin-bottom: 0.85rem;
    min-height: 52px;
    border: 1px solid #1a1a28;
  }
  .spinner-char {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    min-width: 2ch;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 0 12px var(--spinner-glow);
    line-height: 1;
    white-space: pre;
  }
  .spinner-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-secondary);
    opacity: 0.7;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 4px 6px;
    cursor: pointer;
    font-size: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transition: all 0.2s;
  }
  .card:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent); }
  .category-header {
    grid-column: 1 / -1;
    padding: 1.5rem 0 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .font-card .font-preview {
    margin: 0;
    white-space: pre;
    line-height: 1.08;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    color: #89ffcb;
    text-shadow: 0 0 10px rgba(100, 255, 180, 0.2);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .font-dims {
    color: var(--accent-secondary);
    font-size: 0.67rem;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid rgba(70, 96, 148, 0.45);
    background: rgba(20, 28, 46, 0.6);
    border-radius: 7px;
    padding: 0.18rem 0.38rem;
  }
  .font-card .font-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.62rem;
    gap: 0.6rem;
  }
  .font-card {
    background: linear-gradient(160deg, #121826 0%, #101623 52%, #0f1420 100%);
  }
  .font-card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 0% 0%, rgba(100, 136, 255, 0.08), transparent 45%);
    opacity: 0.7;
  }
  .font-card:hover {
    border-color: #33507a;
    background: linear-gradient(160deg, #141c2b 0%, #111a29 52%, #111827 100%);
    box-shadow: 0 12px 32px rgba(5, 10, 22, 0.34);
  }
  .font-card .font-name {
    color: #74ffc0;
  }
  .font-card .font-preview {
    position: relative;
    min-height: 114px;
    padding: 0.68rem 0.76rem;
    background: linear-gradient(180deg, #080a12, #070910);
    border-radius: 9px;
    border: 1px solid #1f2940;
    margin-bottom: 0.62rem;
  }
  .font-card .font-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    position: relative;
    z-index: 1;
  }
  .font-card .font-lib {
    border: 1px solid #2c3e63;
    background: rgba(20, 30, 48, 0.66);
    color: #95a8ca;
    border-radius: 6px;
    padding: 0.18rem 0.42rem;
    font-size: 0.62rem;
  }
  .font-card .font-actions {
    display: inline-flex;
    gap: 0.35rem;
  }
  .font-card .font-actions .btn-copy-art,
  .font-card .font-actions .btn-show-code {
    border: 1px solid var(--tag-border);
    border-radius: 7px;
    background: var(--tag-bg);
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem;
    padding: 0.24rem 0.46rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .font-card .font-actions .btn-copy-art:hover,
  .font-card .font-actions .btn-show-code:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .font-card .font-actions .btn-copy-art.copied {
    border-color: var(--accent);
    color: var(--accent);
  }
  .font-card.error .font-preview {
    color: #ff9f9f;
    opacity: 0.94;
    border-color: rgba(255, 130, 130, 0.35);
  }
  .font-card:not(.loaded):not(.error) .font-preview {
    opacity: 0.5;
    color: var(--text-dim);
    background-image: linear-gradient(90deg, rgba(27, 39, 64, 0.22), rgba(56, 77, 121, 0.22), rgba(27, 39, 64, 0.22));
    background-size: 200% 100%;
    animation: figletLoading 1.35s linear infinite;
  }
  @keyframes figletLoading {
    0% { background-position: 200% 0; }
    100% { background-position: 0 0; }
  }
  .category-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .category-headline {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 0.55rem;
  }
  .fold-toggle {
    width: 22px;
    height: 22px;
    border: 1px solid var(--tag-border);
    border-radius: 7px;
    background: linear-gradient(180deg, #121626, #0f1320);
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
    flex-shrink: 0;
  }
  .fold-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .fold-caret {
    width: 0;
    height: 0;
    border-left: 5px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transform: rotate(90deg);
    transform-origin: 35% 50%;
    transition: transform 0.18s ease;
  }
  .category-header.is-collapsed .fold-caret {
    transform: rotate(0deg);
  }
  .category-header .cat-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 0.5rem;
  }
  .view-control {
    position: relative;
    flex-shrink: 0;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-shrink: 0;
  }
  .collapse-btn {
    padding: 0.36rem 0.55rem;
    border-radius: 9px;
    border: 1px solid var(--tag-border);
    background: linear-gradient(180deg, #121626, #0f1320);
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .collapse-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .view-toggle {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.36rem 0.6rem;
    border-radius: 9px;
    border: 1px solid var(--tag-border);
    background: linear-gradient(180deg, #121626, #0f1320);
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
  }
  .view-toggle:hover {
    border-color: var(--accent);
    color: var(--text-primary);
  }
  .view-control.open .view-toggle {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .view-value {
    color: var(--accent);
    text-transform: capitalize;
  }
  .view-caret {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    margin-left: 0.1rem;
    opacity: 0.75;
  }
  .view-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 0.45rem);
    min-width: 130px;
    background: #0e1220f5;
    border: 1px solid var(--tag-border);
    border-radius: 10px;
    padding: 0.35rem;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    display: none;
    z-index: 25;
  }
  .view-control.open .view-menu { display: block; }
  .view-option {
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 0.45rem 0.55rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .view-option:hover {
    background: var(--tag-bg);
    color: var(--text-primary);
  }
  .view-option.active {
    background: var(--accent-dim);
    color: var(--accent);
  }
  body.view-minimal .grid {
    gap: 0.75rem;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }
  body.view-minimal .card {
    padding: 0.85rem 0.95rem;
    border-radius: 11px;
  }
  body.view-minimal .card-header {
    margin-bottom: 0.52rem;
    align-items: center;
  }
  body.view-minimal .spinner-display {
    margin-bottom: 0;
    min-height: 46px;
    padding: 0.62rem 0.8rem;
  }
  body.view-minimal .spinner-lib {
    position: absolute;
    top: 10px;
    right: 38px;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  body.view-minimal .card-meta {
    position: absolute;
    left: 0.95rem;
    right: 0.95rem;
    bottom: 0.55rem;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    padding-top: 0.25rem;
    background: linear-gradient(180deg, transparent 0%, rgba(8,8,14,0.82) 70%);
  }
  body.view-minimal .card:hover .spinner-lib,
  body.view-minimal .card:hover .card-meta,
  body.view-minimal .card:focus-within .spinner-lib,
  body.view-minimal .card:focus-within .card-meta {
    opacity: 1;
    transform: translateY(0);
  }
  body.view-minimal .progress-card .spinner-text {
    opacity: 0.85;
    color: var(--accent-secondary);
  }
  body.view-minimal .font-card .font-preview {
    min-height: 98px;
    padding: 0.5rem 0.66rem;
    font-size: 0.51rem;
  }
  body.view-minimal .progress-card .spinner-char {
    letter-spacing: 0.02em;
  }
  body.view-list .grid {
    gap: 0.45rem;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  body.view-list .card {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) auto;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0.65rem;
    border-radius: 10px;
  }
  body.view-list .card-header {
    margin: 0;
    align-items: center;

<div class="container">

  <div class="grid" id="grid"></div>
</div>

function startAnim(name, spinner) {
  const el = document.getElementById(`spin-${name}`);
  if (!el) return;
  intervalIds[name] = setInterval(() => {
    animationFrames[name] = (animationFrames[name] + 1) % spinner.frames.length;
    el.textContent = spinner.frames[animationFrames[name]];
  }, spinner.interval / speedMultiplier);
}

function repeatToken(token, count) {
  if (!token || count <= 0) return '';
  return token.repeat(count);
}

function renderProgressBar(bar, progress, widthOverride) {
  const width = Math.max(8, Math.min(40, widthOverride || bar.width || 20));
  const borders = Array.isArray(bar.borders) ? bar.borders : ["", ""];
  const leftBorder = borders[0] || '';
  const rightBorder = borders[1] || '';

  if (Array.isArray(bar.subchars) && bar.subchars.length > 0) {
    const totalSubSteps = width * bar.subchars.length;
    const filledSub = Math.round(progress * totalSubSteps);
    const fullCells = Math.floor(filledSub / bar.subchars.length);
    const remainder = filledSub % bar.subchars.length;
    const fullFillChar = (bar.fill && bar.fill.length) ? bar.fill[bar.fill.length - 1] : '█';
    const tipChar = (fullCells < width && remainder > 0)
      ? bar.subchars[remainder - 1]
      : ((fullCells < width && bar.tip) ? bar.tip : '');
    const emptyCount = width - fullCells - (tipChar ? 1 : 0);
    return leftBorder
      + repeatToken(fullFillChar, fullCells)
      + tipChar
      + repeatToken(bar.empty || ' ', Math.max(0, emptyCount))
      + rightBorder;
  }

  const fillCount = Math.round(progress * width);
  const tipChar = (fillCount < width && bar.tip) ? bar.tip : '';
  const emptyCount = width - fillCount - (tipChar ? 1 : 0);
  return leftBorder
    + repeatToken(bar.fill || '█', fillCount)
    + tipChar
    + repeatToken(bar.empty || ' ', Math.max(0, emptyCount))
    + rightBorder;
}

function startProgressAnim(name, bar) {
  const el = document.getElementById(`bar-${name}`);
  const pct = document.getElementById(`pct-${name}`);
  if (!el) return;

  const tick = () => {
    progressFrames[name] += 0.02;
    if (progressFrames[name] > 1.15) progressFrames[name] = 0;
    const clamped = Math.min(progressFrames[name], 1);
    el.textContent = renderProgressBar(bar, clamped, progressBarWidth);
    if (pct) pct.textContent = `${Math.round(clamped * 100)}%`;
  };

  tick();
  intervalIds[name] = setInterval(tick, Math.max(16, (bar.interval || 60) / speedMultiplier));
}

function restartAll() {
  renderGrid();

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function copyFrames(name, btn) {
  const spinner = SPINNERS[name];
  navigator.clipboard.writeText(JSON.stringify(spinner.frames)).then(() => {
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

function copyProgressConfig(name, btn) {
  const bar = PROGRESS_BARS[name];
  navigator.clipboard.writeText(JSON.stringify(bar, null, 2)).then(() => {
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

function copyFigletSample(name, btn) {
  const font = FIGLET_FONTS[name];
  const sample = (figletRenderCache[`${name}::${figletText}`] || font.sample).join('\n');
  navigator.clipboard.writeText(sample).then(() => {
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = prev || 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

function getFigletCode(name) {
  const font = FIGLET_FONTS[name];
  const text = figletText.trim() || 'Hello';
  const localSample = (figletRenderCache[`${name}::${text}`] || font.sample).join('\n');
  return `# -- pyfiglet -------------------------------------------------
from pyfiglet import Figlet

text = "${text}"
font_name = "${name}"
fig = Figlet(font=font_name)
print(fig.renderText(text))

# -- fallback sample bundled in catalogue --------------------
sample = """${localSample.replace(/"""/g, '\\"\\"\\"')}"""
print(sample)`;
}

function showFigletCode(name) {
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = `figlet :: ${name}`;
  document.getElementById('modalCode').textContent = getFigletCode(name);
  modal.classList.add('active');
}

async function fetchFigletSample(name, text) {
  const key = `${name}::${text}`;
  if (figletRenderCache[key]) return figletRenderCache[key];
  const url = `/api/figlet?font=${encodeURIComponent(name)}&text=${encodeURIComponent(text)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const payload = await response.json();
  if (!payload || !Array.isArray(payload.lines) || payload.lines.length === 0) throw new Error('No figlet lines');
  figletRenderCache[key] = payload.lines;
  return payload.lines;
}

function getFigletRuntimeName(name) {
  return FONT_NAME_MAP[name] || name;
}

const FigletRenderer = (() => {
  const DEBOUNCE_MS = 200;
  let initialized = false;
  let renderTimer = null;

  function currentText() {
    const text = (figletText || '').trim();
    return text || FIGLET_DEFAULT_TEXT;
  }

  function init() {
    if (initialized) return;
    if (typeof figlet !== 'undefined') {
      figlet.defaults({ fontPath: FIGLET_CDN_FONT_PATH });
      try {
        const preload = PRIORITY_FIGLET_KEYS.map(getFigletRuntimeName);
        figlet.preloadFonts(preload, () => {
          preload.forEach(name => figletLoadedFonts.add(name));
        });
      } catch {}
    }
    setupInput();
    initialized = true;
  }

  async function render(fontName, text) {
    const runtimeName = getFigletRuntimeName(fontName);
    if (typeof figlet !== 'undefined') {
      if (figletLoadedFonts.has(runtimeName)) {
        try {
          return figlet.textSync(text, { font: runtimeName });
        } catch {}
      }
      try {
        const rendered = await new Promise((resolve, reject) => {
          figlet.text(text, { font: runtimeName }, (err, data) => {
            if (err || !data) reject(err || new Error('No figlet data'));
            else resolve(data);
          });
        });
        figletLoadedFonts.add(runtimeName);
        return rendered;
      } catch {}
    }

    const fallback = FIGLET_FONTS[fontName]?.sample;
    if (Array.isArray(fallback) && fallback.length) return fallback.join('\n');
    return null;
  }

  function updateDims(fontName, artText) {
    const dims = document.getElementById(`dims-${fontName}`);
    if (!dims) return;
    const lines = String(artText).replace(/\r/g, '').split('\n').filter(line => line.length > 0);
    if (!lines.length) return;
    const h = lines.length;
    const w = Math.max(...lines.map(line => line.length));
    dims.textContent = `${h}h × ${w}w`;
  }

  async function renderCardEl(card, text) {
    const fontName = card.dataset.name;
    if (!fontName) return;
    const pre = card.querySelector('pre.font-preview');
    if (!pre) return;
    const key = `${fontName}::${text}`;
    if (figletRenderCache[key]) {
      pre.textContent = figletRenderCache[key].join('\n');
      updateDims(fontName, pre.textContent);
      card.classList.add('loaded');
      card.classList.remove('error');
      card.dataset.renderedText = text;
      return;
    }
    try {
      const rendered = await render(fontName, text);
      let lines = null;
      if (typeof rendered === 'string' && rendered.trim()) {
        lines = rendered.replace(/\r/g, '').split('\n');
        while (lines.length && lines[lines.length - 1] === '') lines.pop();
      }
      if (!lines || !lines.length) {
        lines = await fetchFigletSample(fontName, text);
      }
      figletRenderCache[key] = lines;
      if (activeTab !== 'figlet') return;
      pre.textContent = lines.join('\n');
      updateDims(fontName, pre.textContent);
      card.classList.add('loaded');
      card.classList.remove('error');
      card.dataset.renderedText = text;
    } catch {
      const fallback = FIGLET_FONTS[fontName]?.sample;
      if (Array.isArray(fallback) && fallback.length) {
        pre.textContent = fallback.join('\n');
      } else {
        pre.textContent = `[${fontName} unavailable]`;
      }
      updateDims(fontName, pre.textContent);
      card.classList.add('error');
      card.classList.remove('loaded');
    }
  }

  async function renderAll(text) {
    const cards = Array.from(document.querySelectorAll('.font-card'))
      .filter(card => card.dataset.visible === '1');
    await Promise.allSettled(cards.map(card => renderCardEl(card, text)));
  }

  function setupLazyLoading() {
    if (figletObserver) {
      figletObserver.disconnect();
      figletObserver = null;
    }
    figletObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const card = entry.target;
        if (entry.isIntersecting) {
          card.dataset.visible = '1';
          if (card.dataset.renderedText !== currentText()) {
            renderCardEl(card, currentText());
          }
          figletObserver.unobserve(card);
        }
      });
    }, { rootMargin: '300px' });

    document.querySelectorAll('.font-card').forEach(card => {
      const name = card.dataset.name || '';
      const isPriority = PRIORITY_FIGLET_KEYS.includes(name);
      if (isPriority) {
        card.dataset.visible = '1';
      } else {
        card.dataset.visible = '0';
        figletObserver.observe(card);
      }
    });
  }

  function setupInput() {
    const input = document.getElementById('figlet-text');
    const counter = document.getElementById('figletCharCount');
    const reset = document.getElementById('figlet-reset');
    if (!input || !counter || !reset) return;
    input.oninput = e => {
      const next = e.target.value.slice(0, FIGLET_MAX_LENGTH);
      e.target.value = next;
      counter.textContent = `${next.length}/${FIGLET_MAX_LENGTH}`;
      figletText = next || FIGLET_DEFAULT_TEXT;
      localStorage.setItem('figletSampleText', figletText);
      if (renderTimer) clearTimeout(renderTimer);
      renderTimer = setTimeout(() => renderAll(currentText()), DEBOUNCE_MS);
    };
    input.onblur = () => {
      if (input.value.trim()) return;
      input.value = FIGLET_DEFAULT_TEXT;
      counter.textContent = `${FIGLET_DEFAULT_TEXT.length}/${FIGLET_MAX_LENGTH}`;
      figletText = FIGLET_DEFAULT_TEXT;
      localStorage.setItem('figletSampleText', figletText);
      renderAll(FIGLET_DEFAULT_TEXT);
    };
    reset.onclick = () => {
      input.value = FIGLET_DEFAULT_TEXT;
      counter.textContent = `${FIGLET_DEFAULT_TEXT.length}/${FIGLET_MAX_LENGTH}`;
      figletText = FIGLET_DEFAULT_TEXT;
      localStorage.setItem('figletSampleText', figletText);
      if (renderTimer) clearTimeout(renderTimer);
      renderAll(FIGLET_DEFAULT_TEXT);
    };
  }

  function onGridRendered(fontNames) {
    init();
    setupLazyLoading();
    const names = Array.isArray(fontNames) ? fontNames : [];
    const immediate = [...new Set([
      ...names.filter(name => PRIORITY_FIGLET_KEYS.includes(name)),
      ...names.slice(0, 10)
    ])];
    immediate.forEach(name => {
      const card = document.querySelector(`.font-card[data-name="${name}"]`);
      if (card) card.dataset.visible = '1';
    });
    renderAll(currentText());
  }

  return {
    init,
    render,
    renderAll,
    renderCardEl,
    setupInput,
    setupLazyLoading,
    onGridRendered
  };
})();

function closeAllViewMenus() {
  document.querySelectorAll('.view-control.open').forEach(ctrl => {
    ctrl.classList.remove('open');
    const btn = ctrl.querySelector('.view-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  });
}

function toggleViewMenu(event) {
  event.stopPropagation();
  const control = event.currentTarget.closest('.view-control');
  if (!control) return;
  const willOpen = !control.classList.contains('open');
  closeAllViewMenus();
  if (willOpen) {
    control.classList.add('open');
    event.currentTarget.setAttribute('aria-expanded', 'true');
  }
}

function setViewMode(mode) {
  if (!['tile', 'minimal', 'list'].includes(mode)) return;
  if (viewMode === mode) {
    closeAllViewMenus();
    return;
  }
  document.body.classList.add('view-transitioning');
  viewMode = mode;
  localStorage.setItem('spinnerViewMode', mode);
  requestAnimationFrame(() => {
    renderGrid();
    requestAnimationFrame(() => {
      document.body.classList.remove('view-transitioning');
    });
  });
}

function toggleCategory(event, category) {
  event.stopPropagation();
  if (collapsedCategories.has(category)) {
    collapsedCategories.delete(category);
  } else {
    collapsedCategories.add(category);
  }
  persistCollapsed();
  renderGrid();
}

function collapseAllCategories() {
  collapsedCategories = new Set(getCategoryOrder());
  persistCollapsed();
  renderGrid();
}

function expandAllCategories() {
  collapsedCategories = new Set();
  persistCollapsed();
  renderGrid();
}

function showCode(name) {
  const spinner = SPINNERS[name];
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = name;
  const framesStr = JSON.stringify(spinner.frames, null, 2);
  const code = `# ── Rich ──────────────────────────────────
from rich.console import Console
console = Console()
with console.status("Loading...", spinner="${name}"):
    pass  # your code

# ── Halo ──────────────────────────────────
from halo import Halo
spinner = Halo(text="Loading...", spinner={
    "interval": ${spinner.interval},
    "frames": ${framesStr}
})
spinner.start()
spinner.stop()

# ── Yaspin ────────────────────────────────
from yaspin import yaspin
from yaspin.spinners import Spinners
with yaspin(Spinners.${name}, text="Loading..."):
    pass  # your code

# ── Raw frames ────────────────────────────
frames = ${framesStr}
interval = ${spinner.interval}  # ms`;
  document.getElementById('modalCode').textContent = code;
  modal.classList.add('active');
}

function showProgressCode(name) {
  const bar = PROGRESS_BARS[name];
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = `progress :: ${name}`;
  const config = JSON.stringify(bar, null, 2);
  const width = progressBarWidth;
  const sample = renderProgressBar(bar, 0.5, width);
  const snippetSet = bar.lib === 'tqdm'
    ? `# ── tqdm (ASCII) ──────────────────────────
${PROGRESS_METHOD_SNIPPETS.tqdm_ascii}

# ── tqdm (Unicode) ────────────────────────
${PROGRESS_METHOD_SNIPPETS.tqdm_unicode}

# ── tqdm (Custom chars) ───────────────────
${PROGRESS_METHOD_SNIPPETS.tqdm_custom}`
    : bar.lib === 'rich'
      ? `# ── Rich (Default) ───────────────────────
${PROGRESS_METHOD_SNIPPETS.rich_default}

# ── Rich (Custom Bar) ─────────────────────
${PROGRESS_METHOD_SNIPPETS.rich_custom}`
      : `# ── alive-progress ───────────────────────
${PROGRESS_METHOD_SNIPPETS.alive_default}

# ── Manual ASCII (zero deps) ──────────────
${PROGRESS_METHOD_SNIPPETS.manual_ascii}

# ── Manual Box (zero deps) ────────────────
${PROGRESS_METHOD_SNIPPETS.manual_box}`;
  const code = `# ── Progress Bar Style ───────────────────
name = "${name}"
sample = "${sample}"

# ── Suggested Python snippet ──────────────
${bar.python || '# custom progress logic'}

# ── Methods From Catalogue ────────────────
${snippetSet}

# ── JS Config ─────────────────────────────
${config}`;
  document.getElementById('modalCode').textContent = code;
  modal.classList.add('active');
}

function copyModalCode() {
  const code = document.getElementById('modalCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-code-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Code'; }, 1500);
  });
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('click', () => closeAllViewMenus());
document.getElementById('searchInput').addEventListener('input', () => renderGrid());
document.getElementById('speedSlider').addEventListener('input', e => {
  speedMultiplier = parseFloat(e.target.value);
  document.getElementById('speedLabel').textContent = speedMultiplier + '×';
  restartAll();
});
document.getElementById('barWidthSlider').addEventListener('input', e => {
  progressBarWidth = parseInt(e.target.value, 10);
  document.getElementById('barWidthLabel').textContent = progressBarWidth;
  localStorage.setItem('progressBarWidth', String(progressBarWidth));
  if (activeTab === 'progress') renderGrid();
});
document.getElementById('figletSortSelect').addEventListener('change', e => {
  figletSort = e.target.value;
  localStorage.setItem('figletSort', figletSort);
  if (activeTab === 'figlet') renderGrid();
});

FigletRenderer.init();
buildTopTabs();
updateTabUI();
if (getActiveCategory() !== 'All' && !getCategoryOrder().includes(getActiveCategory())) {
  setActiveCategory('All');
}
buildFilterTags();
renderGrid();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Spinners Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a0f;
    --bg-card: #12121a;
    --bg-card-hover: #1a1a26;
    --border: #1e1e2e;
    --border-hover: #2e2e44;
    --text-primary: #e2e2ef;
    --text-secondary: #7a7a9a;
    --text-dim: #4a4a66;
    --accent: #64ffb4;
    --accent-dim: #64ffb420;
    --accent-secondary: #6488ff;
    --accent-warn: #ffa864;
    --spinner-glow: #64ffb430;
    --tag-bg: #1a1a2e;
    --tag-border: #2a2a44;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
    position: relative;
    z-index: 1;
  }
  header {
    text-align: center;
    padding: 3rem 0 2rem;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .logo-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    opacity: 0.7;
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 1rem;
    font-weight: 300;
    max-width: 580px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin: 2.5rem 0 1.5rem;
  }
  .search-wrap {
    position: relative;
    flex: 0 1 360px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    width: 16px;
    height: 16px;
  }
  .search-input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.6rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .speed-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  .speed-control input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .filter-tags {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .filter-tag {
    padding: 0.4rem 0.85rem;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 20px;
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .filter-tag:hover { border-color: var(--accent); color: var(--text-primary); }
  .filter-tag.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .stats-bar {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .stats-bar span { color: var(--accent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    transition: all 0.25s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
  }
  .card:hover::before { opacity: 1; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
  }
  .spinner-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }
  .spinner-lib {
    font-size: 0.62rem;
    font-weight: 500;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .spinner-display {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1rem;
    background: #08080e;
    border-radius: 8px;
    margin-bottom: 0.85rem;
    min-height: 52px;
    border: 1px solid #1a1a28;
  }
  .spinner-char {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    min-width: 2ch;
    text-align: center;
    color: var(--accent);
    text-shadow: 0 0 12px var(--spinner-glow);
    line-height: 1;
    white-space: pre;
  }
  .spinner-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-secondary);
    opacity: 0.7;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 4px 6px;
    cursor: pointer;
    font-size: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transition: all 0.2s;
  }
  .card:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent); }
  .category-header {
    grid-column: 1 / -1;
    padding: 1.5rem 0 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }
  .category-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .category-header .cat-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 0.5rem;
  }
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .modal pre {
    background: #08080e;
    border-radius: 8px;
    padding: 1rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: auto;
    border: 1px solid #1a1a28;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .modal-btns { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .modal .close-btn, .modal .copy-code-btn {
    padding: 0.5rem 1.2rem;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--accent);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .modal .close-btn { background: var(--tag-bg); border-color: var(--tag-border); color: var(--text-secondary); }
  .highlight-badge {
    position: absolute;
    top: -1px; left: 20px;
    background: var(--accent);
    color: var(--bg-deep);
    font-size: 0.55rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 0 0 6px 6px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  @media (max-width: 640px) {
    h1 { font-size: 1.8rem; }
    .container { padding: 1rem; }
    .grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; }
    .search-wrap { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-line">/// reference · v2.0</div>
    <h1>Python Spinners Catalogue</h1>
    <p class="subtitle">Live-animated preview of every spinner available in Python CLI libraries. 97 spinners from cli-spinners, Rich, Halo, Yaspin & alive-progress — no terminal required.</p>
  </header>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search spinners by name, category, or library...">
    </div>
    <div class="speed-control">
      <span>Speed</span>
      <input type="range" id="speedSlider" min="0.25" max="3" step="0.25" value="1">
      <span id="speedLabel">1×</span>
    </div>
  </div>
  <div class="filter-tags" id="filterTags"></div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <pre id="modalCode"></pre>
    <div class="modal-btns">
      <button class="copy-code-btn" onclick="copyModalCode()">Copy Code</button>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

//  APP STATE & LOGIC

let speedMultiplier = 1;
let activeCategory = 'All';
let intervalIds = {};
let animationFrames = {};
const CATEGORY_ORDER = ['Dots','Classic','Arrows','Bars & Blocks','Progress','Scenes','Misc','Emoji Spinners'];
const categories = ['All', ...CATEGORY_ORDER];
const totalCount = Object.keys(SPINNERS).length;
const HIGHLIGHTED = ['growUp','growUpOnly','verticalBars'];

function buildFilterTags() {
  const container = document.getElementById('filterTags');
  categories.forEach(cat => {
    const tag = document.createElement('div');
    tag.className = 'filter-tag' + (cat === 'All' ? ' active' : '');
    const count = cat === 'All' ? totalCount : Object.values(SPINNERS).filter(s => s.category === cat).length;
    tag.textContent = `${cat} (${count})`;
    tag.dataset.category = cat;
    tag.addEventListener('click', () => {
      document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      activeCategory = cat;
      renderGrid();
    });
    container.appendChild(tag);
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  Object.values(intervalIds).forEach(id => clearInterval(id));
  intervalIds = {};
  animationFrames = {};

  const filtered = Object.entries(SPINNERS).filter(([name, spinner]) => {
    const matchCat = activeCategory === 'All' || spinner.category === activeCategory;
    const matchSearch = !search || name.toLowerCase().includes(search) ||
      spinner.category.toLowerCase().includes(search) ||
      spinner.lib.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  document.getElementById('statsBar').innerHTML = `Showing <span>${filtered.length}</span> of <span>${totalCount}</span> spinners`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No spinners match your search.</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(([name, spinner]) => {
    if (!grouped[spinner.category]) grouped[spinner.category] = [];
    grouped[spinner.category].push([name, spinner]);
  });

  let html = '';
  const orderedCats = CATEGORY_ORDER.filter(c => grouped[c]);
  for (const category of orderedCats) {
    const items = grouped[category];
    html += `<div class="category-header"><h2>${category}<span class="cat-count">${items.length}</span></h2></div>`;
    items.forEach(([name, spinner]) => {
      const badge = HIGHLIGHTED.includes(name) ? `<div class="highlight-badge">★ Vertical Bar</div>` : '';
      html += `
        <div class="card" data-name="${name}" onclick="showCode('${name}')">
          ${badge}
          <button class="copy-btn" onclick="event.stopPropagation(); copyFrames('${name}', this)" title="Copy frames">copy</button>
          <div class="card-header">
            <span class="spinner-name">${name}</span>
            <span class="spinner-lib">${spinner.lib.split(' / ')[0]}</span>
          </div>
          <div class="spinner-display">
            <span class="spinner-char" id="spin-${name}">${spinner.frames[0]}</span>
            <span class="spinner-text">Loading...</span>
          </div>
          <div class="card-meta">
            <span>${spinner.frames.length} frames</span>
            <span>${spinner.interval}ms</span>
          </div>
        </div>`;
    });
  }
  grid.innerHTML = html;
  filtered.forEach(([name, spinner]) => {
    animationFrames[name] = 0;
    startAnim(name, spinner);
  });
}

function startAnim(name, spinner) {
  const el = document.getElementById(`spin-${name}`);
  if (!el) return;
  intervalIds[name] = setInterval(() => {
    animationFrames[name] = (animationFrames[name] + 1) % spinner.frames.length;
    el.textContent = spinner.frames[animationFrames[name]];
  }, spinner.interval / speedMultiplier);
}

function restartAll() {
  Object.entries(SPINNERS).forEach(([name, spinner]) => {
    if (intervalIds[name]) {
      clearInterval(intervalIds[name]);
      startAnim(name, spinner);
    }
  });
}

function copyFrames(name, btn) {
  const spinner = SPINNERS[name];
  navigator.clipboard.writeText(JSON.stringify(spinner.frames)).then(() => {
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

  const spinner = SPINNERS[name];
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = name;
  const framesStr = JSON.stringify(spinner.frames, null, 2);
  const code = `# ── Rich ──────────────────────────────────

console = Console()
with console.status("Loading...", spinner="${name}"):
    pass  # your code

function copyModalCode() {
  const code = document.getElementById('modalCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-code-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Code'; }, 1500);
  });
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
